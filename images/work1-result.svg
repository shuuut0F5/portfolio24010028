<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="drop-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="480" rx="12" fill="url(#bg-grad)" filter="url(#drop-shadow)"/>

  <!-- Window Header -->
  <rect width="960" height="40" rx="12" fill="url(#bar-grad)"/>
  <rect y="32" width="960" height="8" fill="#1e293b"/>
  <circle cx="24" cy="20" r="6" fill="#ef4444"/>
  <circle cx="44" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="20" r="6" fill="#10b981"/>
  <text x="480" y="24" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="13" font-weight="500" text-anchor="middle">verification-terminal ~ Terraform x LXD Load Balancer (Round Robin)</text>

  <!-- Left Side: Container Status -->
  <g transform="translate(30, 60)">
    <rect width="420" height="390" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="16" y="28" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="13" font-weight="bold">$ lxc list -c ns4t</text>
    
    <line x1="16" y1="38" x2="404" y2="38" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="56" fill="#64748b" font-family="'Fira Code', monospace" font-size="11">NAME   STATE    IPV4              TYPE</text>
    <line x1="16" y1="64" x2="404" y2="64" stroke="#334155" stroke-width="1"/>

    <text x="16" y="86" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="12">web-1</text>
    <text x="75" y="86" fill="#4ade80" font-family="'Fira Code', monospace" font-size="12">RUNNING</text>
    <text x="145" y="86" fill="#93c5fd" font-family="'Fira Code', monospace" font-size="12">10.0.5.101 (8081)</text>
    <text x="320" y="86" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12">CONTAINER</text>

    <text x="16" y="112" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="12">web-2</text>
    <text x="75" y="112" fill="#4ade80" font-family="'Fira Code', monospace" font-size="12">RUNNING</text>
    <text x="145" y="112" fill="#93c5fd" font-family="'Fira Code', monospace" font-size="12">10.0.5.102 (8082)</text>
    <text x="320" y="112" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12">CONTAINER</text>

    <text x="16" y="138" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="12">web-3</text>
    <text x="75" y="138" fill="#4ade80" font-family="'Fira Code', monospace" font-size="12">RUNNING</text>
    <text x="145" y="138" fill="#93c5fd" font-family="'Fira Code', monospace" font-size="12">10.0.5.103 (8083)</text>
    <text x="320" y="138" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12">CONTAINER</text>

    <!-- HAProxy Status Badge -->
    <rect x="16" y="165" width="388" height="65" rx="6" fill="#132338" stroke="#0284c7" stroke-width="1"/>
    <text x="28" y="188" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="12" font-weight="bold">● haproxy.service - HAProxy Load Balancer</text>
    <text x="28" y="206" fill="#4ade80" font-family="'Fira Code', monospace" font-size="11">   Active: active (running) | Port: 8080</text>
    <text x="28" y="222" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11">   Algorithm: roundrobin | Backends: 3/3 UP</text>

    <!-- Metrics box -->
    <rect x="16" y="245" width="388" height="130" rx="6" fill="#1e293b"/>
    <text x="28" y="270" fill="#f1f5f9" font-family="'Zen Kaku Gothic New', sans-serif" font-size="13" font-weight="bold">構築成果ハイライト</text>
    <text x="28" y="295" fill="#cbd5e1" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12">✔ 構築サーバー数: <tspan fill="#38bdf8" font-weight="bold">3台</tspan> (Ubuntu 22.04 LTS)</text>
    <text x="28" y="318" fill="#cbd5e1" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12">✔ 環境再構築時間: 手動45分 ➔ <tspan fill="#4ade80" font-weight="bold">1分40秒</tspan> (96%短縮)</text>
    <text x="28" y="341" fill="#cbd5e1" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12">✔ 負荷分散アルゴリズム: Round Robin (均等1:1:1)</text>
    <text x="28" y="364" fill="#cbd5e1" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12">✔ 再現コマンド: <tspan fill="#fbbf24">vagrant up</tspan> 1コマンドで完全自動化</text>
  </g>

  <!-- Right Side: Round-Robin Verification -->
  <g transform="translate(480, 60)">
    <rect width="450" height="390" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
    
    <text x="20" y="28" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="13" font-weight="bold">$ curl http://localhost:8080</text>
    <rect x="20" y="38" width="410" height="42" rx="4" fill="#14281d" stroke="#15803d" stroke-width="1"/>
    <text x="32" y="56" fill="#86efac" font-family="'Fira Code', monospace" font-size="12">おはようございます、1番のサーバーです。</text>
    <text x="32" y="72" fill="#4ade80" font-family="'Fira Code', monospace" font-size="11">Good morning, this is server 1. [web-1:8081]</text>

    <text x="20" y="105" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="13" font-weight="bold">$ curl http://localhost:8080</text>
    <rect x="20" y="115" width="410" height="42" rx="4" fill="#14281d" stroke="#15803d" stroke-width="1"/>
    <text x="32" y="133" fill="#86efac" font-family="'Fira Code', monospace" font-size="12">こんにちは、2番のサーバーです。</text>
    <text x="32" y="149" fill="#4ade80" font-family="'Fira Code', monospace" font-size="11">Hello, this is server 2. [web-2:8082]</text>

    <text x="20" y="182" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="13" font-weight="bold">$ curl http://localhost:8080</text>
    <rect x="20" y="192" width="410" height="42" rx="4" fill="#14281d" stroke="#15803d" stroke-width="1"/>
    <text x="32" y="210" fill="#86efac" font-family="'Fira Code', monospace" font-size="12">こんばんは、3番のサーバーです。</text>
    <text x="32" y="226" fill="#4ade80" font-family="'Fira Code', monospace" font-size="11">Good evening, this is server 3. [web-3:8083]</text>

    <text x="20" y="259" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="13" font-weight="bold">$ curl http://localhost:8080</text>
    <rect x="20" y="269" width="410" height="42" rx="4" fill="#14281d" stroke="#15803d" stroke-width="1"/>
    <text x="32" y="287" fill="#86efac" font-family="'Fira Code', monospace" font-size="12">おはようございます、1番のサーバーです。 (循環)</text>
    <text x="32" y="303" fill="#4ade80" font-family="'Fira Code', monospace" font-size="11">Good morning, this is server 1. [web-1:8081]</text>

    <!-- Validation banner -->
    <rect x="20" y="325" width="410" height="50" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="32" y="347" fill="#c7d2fe" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" font-weight="bold">【検証結果】ラウンドロビン負荷分散が正常稼働</text>
    <text x="32" y="365" fill="#a5b4fc" font-family="'Zen Kaku Gothic New', sans-serif" font-size="11">リクエストごとに 1 ➔ 2 ➔ 3 ➔ 1 へ均等に振り分け成功</text>
  </g>
</svg>